interface:
  display_name: "Design Doc To UI"
  short_description: "Turn product docs into complete reviewed interactive UI prototypes."
  default_prompt: "Use $design-doc-to-ui to convert this product document into reviewed app UI images, a structured design document, and a real interactive HTML prototype. Initialize ui-run.json with the bundled scripts, create SubAgents directly for style exploration, UI image generation, and calibration, keep at most 6 active SubAgents, and run the design-completion script gate before HTML/Figma. Follow the user's request language, cover every required page, and build HTML from approved designs and docs rather than screenshots."
