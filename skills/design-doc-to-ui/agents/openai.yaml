interface:
  display_name: "Design Doc To UI"
  short_description: "Expand ideas into gated UI packages."
  default_prompt: "Use $design-doc-to-ui to convert or revise a vague product idea, rough requirement, or source product document into a checkpointed UI design package. If the input is ambiguous, first discuss and expand it into source/expanded-product-brief.md with users, scenarios, page inventory, assumptions, interaction model, style hypotheses, risks, and open questions, then stop for user approval before freezing scope. Extract requirements, run style exploration, then stop for user approval before interaction design. After page briefs, route/state design, and an interaction/visual concept packet or low/mid-fidelity interaction demo when useful, stop again for user approval. Generate imagegen UI page images through page SubAgents, audit them, then stop for user approval before writing the structured design document. The structured design document must be a clean review-grade design document, not a screenshot catalog, delivery status report, audit appendix, or React/Figma/Feishu verification report; delivery materials stay local in qa artifacts. If Feishu is requested, upload only the clean rich design document, fetch the Feishu link back, verify it is current, complete, has no mojibake/stale placeholders, and contains no delivery/audit material, then get user approval before React/Figma. Preserve ui-run.json gates, SubAgent batching at 6 active workers, formal React interaction verification, 0.80 visual parity, and optional Figma page-worker replica audits only when requested."
