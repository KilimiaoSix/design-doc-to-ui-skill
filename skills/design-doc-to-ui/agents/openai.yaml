interface:
  display_name: "Design Doc To UI"
  short_description: "Create and revise gated UI design packages."
  default_prompt: "Use $design-doc-to-ui to convert or revise this product document into imagegen-generated UI page images, a quality-gated structured design document, and a runnable React prototype. Before style sampling, extract explicit source style expectations and weight them above catalog defaults. The main agent first creates the app shell/style scaffold, right-side page switcher, scroll container contract, and page-worker ownership map, then page SubAgents perform approved-image visual decomposition, DOM element mapping, visual replica audit, scrollability checks, and interaction self-review with at most 6 active workers. For redo/revision work, write qa/revision-plan.json, start required SubAgents, and register qa/revision-subagent-registry.json instead of doing direct main-thread implementation. Preserve ui-run.json gates, structured-design-doc audit, formal frontend interaction verification, 0.80 visual parity, and optional Feishu/Figma companion delivery only when requested; Figma page workers must also write visual decomposition, Figma layer inventory, and visual replica audit artifacts."
