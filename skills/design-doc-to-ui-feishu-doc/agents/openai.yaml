interface:
  display_name: "Design Doc To UI Feishu Doc"
  short_description: "Create clean rich Feishu design docs."
  default_prompt: "Use $design-doc-to-ui-feishu-doc to turn an approved, quality-gated design-doc-to-ui run into a clean rich Feishu/Lark product design document. Read lark-doc and lark-whiteboard guidance first, preserve source traceability, user stories, design acceptance criteria, interaction/state matrices, component tokens, accessibility notes, page images, and design thinking. Do not upload delivery conclusions, audit results, worker evidence, run commands, visual parity scores, React/Figma/Feishu verification, upload verification, or local artifact paths. After upload, fetch the published Feishu link back and verify remote content is current, covers required design sections/pages/images, has no delivery/audit material, and has no mojibake, [object Object], stale placeholders, or question-mark replacement runs. Write both local qa/feishu-doc-audit.json and qa/feishu-doc-content-audit.json; do not pass until the remote link content audit passes."
