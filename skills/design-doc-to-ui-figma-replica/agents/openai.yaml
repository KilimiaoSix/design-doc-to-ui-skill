interface:
  display_name: "Design Doc To UI Figma Replica"
  short_description: "Build editable Figma replicas from approved images."
  default_prompt: "Use $design-doc-to-ui-figma-replica to create or update Figma from a completed design-doc-to-ui run through page-level Figma Replica SubAgents, with at most 6 active workers. Load figma-use before use_figma, use approved AI images and React screenshots as references, create fully editable frontend-handoff-ready frames that basically replicate the imagegen designs, require every page worker to write visual-decomposition.json, figma-layer-inventory.json, and figma-visual-replica-audit.json, reconstruct missing icons/assets through crop-reference plus image_gen asset SubAgents, have the main agent wire and verify global prototype links/cross-frame jumps, and write qa/figma-worker-result.json plus qa/figma-replica-audit.json with every page at least 0.80, editable_element_coverage >= 0.95, global_prototype_links_passed=true, and no hard failures."
